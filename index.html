<!doctype html>
<html lang="ko">
  <head>
    <!-- Google Tag Manager — 컨테이너 ID는 빌드 때 박힌다
         개발 빌드에서는 빈 값이라 아래 분기를 타지 않는다 -->
    <script>
      ;(function (w, d, s, l, i) {
        if (!i) return
        w[l] = w[l] || []
        w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' })
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s)
        j.async = true
        j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i
        f.parentNode.insertBefore(j, f)
      })(window, document, 'script', 'dataLayer', '%VITE_GTM_ID%')
    </script>
    <!-- End Google Tag Manager -->

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Devs</title>
    <meta
      name="description"
      content="실시간 채용공고 분석, 기업별 매칭률, AI 맞춤형 로드맵까지 한곳에서 관리하세요."
    />

    <!-- 링크 공유 미리보기. 공유 봇은 JS를 실행하지 않고 이 파일만 읽어서 모든 주소가 같은 카드로 보인다
         이미지는 전체 주소여야 가져가므로 운영 도메인을 적는다. 이미지는 Figma 랜딩 히어로(818:7666) export -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Devs" />
    <meta property="og:url" content="https://kangyu.shop/" />
    <meta property="og:title" content="Devs | 데이터로 보는 IT 채용 트렌드" />
    <meta
      property="og:description"
      content="실시간 채용공고 분석, 기업별 매칭률, AI 맞춤형 로드맵까지 한곳에서 관리하세요."
    />
    <meta property="og:image" content="https://kangyu.shop/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="감으로 하는 취업 준비는 끝. 데이터가 보여주는 기술 트렌드"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

  </body>
